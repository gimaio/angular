<div class="toolbar">
    <label>
      Colore:
      <input type="color" (input)="changeColor($event)">
    </label>
  
    <label>
      Spessore:
      <input type="range" min="1" max="20" value="4" (input)="changeSize($event)">
    </label>
  
    <label>
      Retention (sec):
      <input type="number" min="1" max="60" value="5" (input)="changeRetention($event)">
    </label>
  
    <button (click)="clearCanvas()">Pulisci</button>
  </div>
  
  <div class="canvas-wrapper">
    <canvas #canvas id="eyeCanvas"></canvas>
  </div>
  
  <video #video autoplay playsinline width="320" height="240"></video>
