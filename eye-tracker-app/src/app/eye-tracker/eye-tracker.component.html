<video #video autoplay muted playsinline class="d-none"></video>

<div class="container py-4">
  <div class="row mb-3">
    <div class="col">
      <label for="leftSelect">Simbolo sinistro:</label>
      <select id="leftSelect" class="form-select" [(ngModel)]="leftSymbol">
        <option *ngFor="let s of symbols" [value]="s">{{ s }}</option>
      </select>
    </div>
    <div class="col">
      <label for="rightSelect">Simbolo destro:</label>
      <select id="rightSelect" class="form-select" [(ngModel)]="rightSymbol">
        <option *ngFor="let s of symbols" [value]="s">{{ s }}</option>
      </select>
    </div>
  </div>


  <div class="d-flex justify-content-between align-items-center vh-50">
    <div
      #leftRef
      [ngClass]="{'selected': selected === 'left'}"
      class="symbol"
    >
      {{ leftSymbol }}
    </div>
  
    <div
      #rightRef
      [ngClass]="{'selected': selected === 'right'}"
      class="symbol"
    >
      {{ rightSymbol }}
    </div>
  </div>
  
</div>
